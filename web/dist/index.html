    <script>
      // Resolve theme before first paint (prevents a light flash).
      // Mirror of App.tsx: saved preference wins, then OS preference,
      // then dark as the baseline default.
      (function () {
        try {
          var s = localStorage.getItem('anvesha-theme')
          var t
          if (s === 'light' || s === 'dark') {
            t = s
          } else {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
